name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vectora-engine-skainet's jvm target is Java 21 (SKaiNET ships Java 21 bytecode).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Model-dependent tests skip themselves when the model cache is absent;
      # the tokenizer golden test and all other unit tests always run.
      - name: Run JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew :vectora-core:jvmTest :vectora-engine-skainet:jvmTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
